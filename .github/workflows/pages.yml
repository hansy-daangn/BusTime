name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # index.html = 사용자용 (DEV 블록 제거), dev.html = 개발자용 (전체)
      - name: Build user/dev pages
        run: |
          mkdir -p _site
          node -e "
          const fs = require('fs');
          const h = fs.readFileSync('app.html', 'utf8');
          fs.writeFileSync('_site/dev.html', h);
          fs.writeFileSync('_site/index.html', h.replace(/<!-- DEV:START -->[\s\S]*?<!-- DEV:END -->/g, ''));
          "
          if [ -d data ]; then cp -r data _site/data; fi
          touch _site/.nojekyll

      # gh-pages 브랜치로 푸시 — 브랜치가 생기면 Pages가 자동 활성화된다
      - name: Push to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
