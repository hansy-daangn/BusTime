name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # index.html = 사용자용 (DEV 블록 제거), dev.html = 개발자용 (전체)
      - name: Build user/dev pages
        run: |
          mkdir -p _site
          node -e "
          const fs = require('fs');
          const h = fs.readFileSync('app.html', 'utf8');
          fs.writeFileSync('_site/dev.html', h);
          fs.writeFileSync('_site/index.html', h.replace(/<!-- DEV:START -->[\s\S]*?<!-- DEV:END -->/g, ''));
          "

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
